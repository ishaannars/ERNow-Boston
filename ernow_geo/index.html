<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{width:100%;min-height:48px;border:1px solid #3f4a3c;border-radius:12px;background:#2f3a2c;color:#f7f3e8;
  font-size:16px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.99)} button[disabled]{opacity:.75;cursor:default}
.why{margin:.45rem .1rem 0;color:#6b6b62;font-size:13px;line-height:1.35}
</style></head><body>
<button id="b">📍 Use my location</button>
<div class="why">Used once to find nearby ERs. Never stored.</div>
<script>
const send=(type,extra)=>window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra||{}),"*");
const height=()=>send("streamlit:setFrameHeight",{height:document.body.scrollHeight+4});
send("streamlit:componentReady",{apiVersion:1}); height();
const b=document.getElementById("b");
const done=v=>send("streamlit:setComponentValue",{value:v,dataType:"json"});
b.onclick=()=>{
  if(!navigator.geolocation){done({error:"unsupported"});return;}
  b.disabled=true; b.textContent="Finding your location…";
  navigator.geolocation.getCurrentPosition(
    p=>{b.textContent="Location found ✓";done({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,t:Date.now()});},
    e=>{b.disabled=false;b.textContent="📍 Use my location";done({error:e.code===1?"denied":(e.code===3?"timeout":"unavailable"),t:Date.now()});},
    {enableHighAccuracy:false,maximumAge:600000,timeout:8000});
};
window.addEventListener("resize",height);
</script></body></html>
