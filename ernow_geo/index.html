<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style></head><body>
<script>
// Headless: ERNow's own (native) button asks for location; this frame only talks to the browser.
const send=(type,extra)=>window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra||{}),"*");
send("streamlit:componentReady",{apiVersion:1});
send("streamlit:setFrameHeight",{height:0});
const done=v=>send("streamlit:setComponentValue",{value:v,dataType:"json"});
let asked=false;
window.addEventListener("message",ev=>{
  const d=ev.data||{}; if(d.type!=="streamlit:render"||asked) return; asked=true;
  if(!navigator.geolocation){done({error:"unsupported",t:Date.now()});return;}
  navigator.geolocation.getCurrentPosition(
    p=>done({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,t:Date.now()}),
    e=>done({error:e.code===1?"denied":(e.code===3?"timeout":"unavailable"),t:Date.now()}),
    {enableHighAccuracy:false,maximumAge:600000,timeout:8000});
});
</script></body></html>
