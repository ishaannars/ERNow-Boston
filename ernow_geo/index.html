<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;
  font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif}
#wrap{padding:1px 1px 2px}
button{width:100%;min-height:48px;display:flex;align-items:center;justify-content:center;gap:.5rem;
  border:1px solid #B9AD91;border-radius:10px;background:#FFFDF5;color:#1C1B19;font-family:inherit;
  font-size:16px;font-weight:600;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:border-color .15s,background .15s}
button:hover{border-color:#A85B45;background:rgba(168,91,69,.10)} button[disabled]{opacity:.8;cursor:default}
svg{width:18px;height:18px;flex:0 0 auto}
.why{margin:.45rem .1rem 0;color:#403A32;opacity:.8;font-size:14px;line-height:1.4}
</style></head><body><div id="wrap">
<button id="b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 1 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span id="t">Use my location</span></button>
<div class="why">Used once to find nearby ERs. Never stored.</div></div>
<script>
const send=(type,extra)=>window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra||{}),"*");
const wrap=document.getElementById("wrap"); let last=0;
// Size the frame to the content only (no feedback loop, so no growing blank space).
const fit=()=>{const h=Math.ceil(wrap.getBoundingClientRect().height); if(h&&h!==last){last=h;send("streamlit:setFrameHeight",{height:h});}};
send("streamlit:componentReady",{apiVersion:1}); fit();
if(window.ResizeObserver){new ResizeObserver(fit).observe(wrap);} if(document.fonts){document.fonts.ready.then(fit);}
const b=document.getElementById("b"), t=document.getElementById("t");
const done=v=>send("streamlit:setComponentValue",{value:v,dataType:"json"});
b.onclick=()=>{
  if(!navigator.geolocation){done({error:"unsupported",t:Date.now()});return;}
  b.disabled=true; t.textContent="Finding your location…";
  navigator.geolocation.getCurrentPosition(
    p=>{t.textContent="Location found";done({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,t:Date.now()});},
    e=>{b.disabled=false;t.textContent="Use my location";done({error:e.code===1?"denied":(e.code===3?"timeout":"unavailable"),t:Date.now()});},
    {enableHighAccuracy:false,maximumAge:600000,timeout:8000});
};
</script></body></html>
