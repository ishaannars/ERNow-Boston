name: Keep apps awake
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Open each app in a real browser
        shell: python
        run: |
          from playwright.sync_api import sync_playwright
          APPS = ["https://ernowboston.streamlit.app/", "https://icinema.streamlit.app/"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for url in APPS:
                  page = browser.new_page()
                  page.goto(url, timeout=90_000)
                  page.wait_for_timeout(8_000)
                  woke = False
                  for frame in page.frames:
                      wake = frame.get_by_role("button", name="Yes, get this app back up!")
                      if wake.count():
                          wake.first.click()
                          woke = True
                          break
                  if woke:
                      print(url, "was asleep, woke it")
                      page.wait_for_timeout(60_000)
                  else:
                      print(url, "awake")
                      page.wait_for_timeout(15_000)
                  page.close()
              browser.close()
